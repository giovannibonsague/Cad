<!doctype html>
<html lang="en" data-theme="graphite">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoboDesk</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/pages.css">
  <link rel="stylesheet" href="styles/wiring.css">
  <link rel="stylesheet" href="styles/modeler.css">
</head>
<body>
  <div id="app">
    <header class="titlebar" data-tauri-drag-region>
      <div class="titlebar-brand" data-tauri-drag-region>
        <span id="brand-icon" class="brand-icon" aria-hidden="true"></span>
        <span class="brand-name" data-tauri-drag-region>RoboDesk</span>
        <span class="brand-sep" data-tauri-drag-region>/</span>
        <span id="titlebar-section" class="brand-section" data-tauri-drag-region>Dashboard</span>
      </div>
      <div class="window-controls">
        <button id="win-min" class="wc" type="button" aria-label="Minimize" title="Minimize"></button>
        <button id="win-max" class="wc" type="button" aria-label="Maximize" title="Maximize"></button>
        <button id="win-close" class="wc wc-close" type="button" aria-label="Close" title="Close"></button>
      </div>
    </header>

    <div class="shell">
      <nav id="sidebar" class="sidebar" aria-label="Main navigation"></nav>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <footer class="statusbar" role="status" aria-live="polite">
      <span id="status-text" class="status-text">Status: Ready</span>
      <span id="status-project" class="status-project"></span>
      <span id="status-data" class="status-data"></span>
    </footer>
  </div>
  <div id="overlay-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
