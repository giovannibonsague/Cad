[package]
name = "robodesk"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "RoboDesk: robotics engineering workspace"
publish = false

[lib]
name = "robodesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
robodesk-core = { path = "../crates/robodesk-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
