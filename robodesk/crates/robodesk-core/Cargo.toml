[package]
name = "robodesk-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "RoboDesk data layer: SQLite schema, migrations, validation, BOM math, backups. No GUI dependencies."
publish = false

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
