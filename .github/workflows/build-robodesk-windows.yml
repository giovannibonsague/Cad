name: Build RoboDesk Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['robodesk/**', '.github/workflows/build-robodesk-windows.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: robodesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: robodesk }
      - name: npm ci
        shell: bash
        run: npm ci 2>&1 | tee ../ci-npm.log; exit ${PIPESTATUS[0]}
      - name: Rust core tests
        shell: bash
        continue-on-error: true
        run: cargo test -p robodesk-core 2>&1 | tee ../ci-cargo-test.log; exit ${PIPESTATUS[0]}
      - name: JS unit tests
        shell: bash
        continue-on-error: true
        run: npm run test:unit 2>&1 | tee ../ci-unit.log; exit ${PIPESTATUS[0]}
      - name: Build installer
        shell: bash
        run: npx tauri build 2>&1 | tee ../ci-build.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        with:
          name: robodesk-windows-installer
          path: robodesk/target/release/bundle/nsis/*.exe
      - name: Publish GitHub release
        shell: bash
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.0 --cleanup-tag --yes || true
          gh release create v0.1.0 robodesk/target/release/bundle/nsis/*.exe \
            --target "$GITHUB_SHA" --title "RoboDesk 0.1.0" \
            --notes "Windows installer (NSIS, per-user). Built by GitHub Actions from commit $GITHUB_SHA."
      - name: Push logs to ci-logs branch
        if: always()
        continue-on-error: true
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/logs && cp ci-*.log /tmp/logs/ 2>/dev/null || true
          for f in /tmp/logs/*.log; do tail -n 150 "$f" > "$f.tail"; done
          git config user.name github-actions && git config user.email actions@github.com
          git checkout --orphan ci-logs && git rm -rf . -q
          cp /tmp/logs/*.tail . 2>/dev/null || echo "no logs" > none.txt
          git add -A && git commit -q -m "ci logs for ${GITHUB_SHA}" && git push -f origin ci-logs
