name: Build RoboDesk Windows installer
on:
  workflow_dispatch:
  push:
    paths: ['robodesk/**', '.github/workflows/build-robodesk-windows.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: robodesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: robodesk }
      - run: npm ci
      - run: cargo test -p robodesk-core
      - run: npm run test:unit
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: robodesk-windows-installer
          path: robodesk/target/release/bundle/nsis/*.exe
      - name: Publish installer to a branch
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p ../out && cp robodesk/target/release/bundle/nsis/*.exe ../out/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan robodesk-installer-build
          git rm -rf . -q
          cp ../out/*.exe .
          git add *.exe && git commit -q -m "RoboDesk installer from ${GITHUB_SHA}"
          git push -f origin robodesk-installer-build
