name: Build RoboDesk Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['robodesk/**', '.github/workflows/build-robodesk-windows.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: robodesk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: robodesk }
      - run: npm ci
      - run: cargo test -p robodesk-core
      - run: npm run test:unit
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: robodesk-windows-installer
          path: robodesk/target/release/bundle/nsis/*.exe
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.0 --cleanup-tag --yes || true
          gh release create v0.1.0 robodesk/target/release/bundle/nsis/*.exe \
            --target "$GITHUB_SHA" --title "RoboDesk 0.1.0" \
            --notes "Windows installer (NSIS, per-user). Built by GitHub Actions from commit $GITHUB_SHA."
